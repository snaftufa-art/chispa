<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chispa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>@font-face{font-family:'Lexend';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lexend-400.woff2) format('woff2')}
@font-face{font-family:'Lexend';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/lexend-500.woff2) format('woff2')}
@font-face{font-family:'Lexend';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/lexend-600.woff2) format('woff2')}
@font-face{font-family:'Lexend';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/lexend-700.woff2) format('woff2')}
@font-face{font-family:'Lexend';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/lexend-800.woff2) format('woff2')}
@font-face{font-family:'Tilt Neon';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/tilt-neon.woff2) format('woff2')}
</style>
<style>
/* Chispa: cute cyberpunk. Near-black violet, hot-pink and neon-blue glow, Wilma the black cat as guide.
   Layout: one-column phone app, sticky stats bar, scrolling path, bottom tabs. */
:root{
  --night:#0a0618;
  --cobalt:#1a1036;
  --cobalt-2:#2e1c63;
  --tile:#efe6ff;
  --ink:#170a33;
  --pink:#ff4fb0;
  --blue:#2de2ff;
  --sol:#ff4fb0;
  --sol-deep:#a81a6c;
  --fuego:#2de2ff;
  --menta:#3dffa8;
  --coral:#ffa53d;
  --text:#f3edff;
  --muted:#a99bd1;
  --line:rgba(190,160,255,.16);
  --display:"Tilt Neon", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--night);
  background-image:radial-gradient(60% 40% at 15% 0%,rgba(255,79,176,.16),transparent 70%),radial-gradient(60% 40% at 100% 30%,rgba(45,226,255,.12),transparent 70%),linear-gradient(rgba(190,160,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(190,160,255,.05) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.svg{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#top{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(10,6,24,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.chip{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);font-size:15px}
.chip .svg{width:20px;height:20px}
.chip.lvl{background:var(--tile);color:var(--ink);font-family:var(--display);font-weight:400;padding:4px 12px}
.chip.flame.off{filter:grayscale(1);opacity:.6}
.chip.boost{background:var(--sol);color:var(--ink);font-size:13px}
#top .spacer{flex:1}
.ring{position:relative;width:38px;height:38px}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--muted)}
.ring.full span{color:var(--sol)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 150px;scroll-behavior:smooth}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(10,6,24,.96);border-top:1px solid var(--line);padding:6px 4px 10px;z-index:5}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:12px}
#nav button .svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--sol)}
#nav button[aria-current="page"] .svg{transform:translateY(-1px)}

/* ---------- home ---------- */
.go{position:absolute;left:16px;right:16px;bottom:78px;z-index:4;display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:999px;background:var(--sol);color:var(--ink);box-shadow:0 6px 0 var(--sol-deep),0 12px 30px rgba(0,0,0,.4);text-align:left;transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sol-deep)}
.go .play{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--sol);display:grid;place-items:center;flex:none}
.go .play .svg{width:20px;height:20px}
.go b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.go small{display:block;font-size:13px;opacity:.8}
.quests{background:rgba(26,16,54,.75);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;margin-bottom:22px}
.quests h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.q{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;font-size:14px}
.q .bar{grid-column:1/-1;height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.q .bar i{display:block;height:100%;background:var(--sol);border-radius:9px;transition:width .5s}
.q.done{color:var(--muted)}
.q.done .bar i{background:var(--menta)}
.q .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.btn-chest{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--fuego);color:#fff;font-weight:700;animation:wiggle 1.6s infinite}

.unit{margin:8px 0 18px}
.plaque{position:relative;background:var(--tile);color:var(--ink);border-radius:14px;padding:14px 16px 13px;box-shadow:inset 0 0 0 3px var(--tile),inset 0 0 0 5px var(--cobalt-2),0 6px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:12px}
.plaque.locked{opacity:.55}
.plaque .meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--cobalt-2)}
.plaque h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:2px 0}
.plaque p{margin:0;font-size:13px;color:#4a3a80}
.plaque .txt{flex:1;min-width:0}
.tipbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--cobalt-2);padding:8px 10px;border-radius:12px;border:2px solid var(--cobalt-2)}
.tipbtn .svg{width:20px;height:20px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 0 8px}
.node{position:relative;width:70px;height:66px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;transition:transform .1s}
.node:active{transform:translateY(4px)}
.node .svg{width:30px;height:30px}
.node.done{background:var(--sol);color:var(--ink);box-shadow:0 6px 0 var(--sol-deep)}
.node.cur{background:var(--tile);color:var(--ink);box-shadow:0 6px 0 #a48fd0,0 0 0 6px rgba(255,79,176,.35)}
.node.cur::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--sol);animation:pulse 1.6s infinite}
.node.locked{background:var(--cobalt-2);color:rgba(255,255,255,.35);box-shadow:0 6px 0 #1c1040}
.node.boss{width:84px;height:78px}
.bubble{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--tile);color:var(--ink);font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.06em;padding:6px 12px;border-radius:10px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;text-transform:uppercase}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--tile)}
.levelgate{text-align:center;margin:28px 0 18px;font-family:var(--display);font-size:30px;color:var(--sol)}
.levelgate small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

/* ---------- cards (train / me / badges) ---------- */
.h1{font-family:var(--display);font-weight:400;font-size:32px;margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.card{background:rgba(26,16,54,.8);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:18px;margin-bottom:4px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.big{font-family:var(--display);font-size:44px;line-height:1;color:var(--sol)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--sol);color:var(--ink);font-weight:700;box-shadow:0 4px 0 var(--sol-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sol-deep)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn.wide{width:100%}
.btn[disabled]{background:rgba(255,255,255,.1);color:var(--muted);box-shadow:none;cursor:default}
.strength{display:flex;height:14px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.08);margin:10px 0 6px}
.strength i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);text-align:left;width:100%}
.li .num{width:36px;height:36px;border-radius:10px;background:var(--tile);color:var(--ink);display:grid;place-items:center;font-family:var(--display);flex:none}
.li.locked{opacity:.45}
.li b{display:block;font-size:15px}
.li small{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.05);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--text);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--cobalt-2);min-height:4px}
.week i.hit{background:var(--sol)}
.week span{font-size:11px;color:var(--muted)}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:4px;border-radius:14px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--tile);color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.toggle .sw{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked="true"] .sw{background:var(--menta)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;border-radius:16px;background:rgba(255,255,255,.05);font-size:12px}
.badge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--sol);color:var(--ink);box-shadow:0 4px 0 var(--sol-deep),inset 0 0 0 4px rgba(255,255,255,.35)}
.badge .medal .svg{width:28px;height:28px}
.badge.off .medal{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3);box-shadow:none}
.badge b{font-size:12.5px}
.badge small{color:var(--muted);font-size:11px;line-height:1.3}
.shop .li{background:rgba(255,255,255,.05)}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--menta)}

/* ---------- lesson overlay ---------- */
.screen{position:fixed;inset:0;z-index:20;background:var(--night);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.xbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.xbtn .svg{width:24px;height:24px}
.prog{flex:1;height:16px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--menta);border-radius:99px;transition:width .35s cubic-bezier(.3,1.4,.6,1)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.prog.hot i{background:linear-gradient(90deg,var(--sol),var(--fuego))}
.combo{display:flex;align-items:center;gap:2px;font-family:var(--display);color:var(--fuego);font-size:18px;min-width:52px;justify-content:flex-end;transition:transform .15s}
.combo .svg{width:22px;height:22px}
.combo.pop{transform:scale(1.35)}
.combo.hide{visibility:hidden}
.lbody{flex:1;overflow-y:auto;padding:12px 18px 18px;display:flex;flex-direction:column}
.instr{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.instr .new{background:var(--fuego);color:#fff;padding:2px 8px;border-radius:99px;font-size:11px;letter-spacing:.06em}
.prompt{font-size:26px;font-weight:600;line-height:1.25;margin:4px 0 22px;display:flex;align-items:flex-start;gap:12px}
.prompt.es{font-size:28px}
.say{flex:none;width:52px;height:52px;border-radius:16px;background:var(--cobalt-2);display:grid;place-items:center;color:var(--sol);box-shadow:0 4px 0 #1c1040}
.say .svg{width:26px;height:26px}
.say.sm{width:40px;height:40px;border-radius:12px}
.say.sm .svg{width:20px;height:20px}
.say.slow{background:transparent;box-shadow:none;border:2px solid var(--cobalt-2)}
.audioRow{display:flex;gap:14px;justify-content:center;margin:12px 0 26px}
.audioRow .say{width:84px;height:84px;border-radius:24px}
.audioRow .say .svg{width:40px;height:40px}
.audioRow .say.slow{width:60px;height:60px;align-self:center}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.04);font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .06s,border-color .1s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.opt[aria-pressed="true"]{border-color:var(--sol);background:rgba(255,79,176,.12)}
.opt.right{border-color:var(--menta);background:rgba(61,255,168,.15)}
.opt.wrong{border-color:var(--coral);background:rgba(255,165,61,.15)}
.answer{min-height:112px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:6px 0 12px;margin-bottom:20px;background:repeating-linear-gradient(transparent 0 55px,var(--line) 55px 57px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:10px 14px;border-radius:12px;background:var(--tile);color:var(--ink);font-size:18px;font-weight:500;box-shadow:0 4px 0 #a48fd0;transition:transform .06s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #a48fd0}
.tile.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pair{padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.04);font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.35);min-height:58px;transition:opacity .25s,transform .06s}
.pair[aria-pressed="true"]{border-color:var(--sol);background:rgba(255,79,176,.12)}
.pair.ok{border-color:var(--menta);background:rgba(61,255,168,.15);opacity:.35;pointer-events:none;box-shadow:none}
.pair.bad{border-color:var(--coral);animation:shake .3s}
.pair.fresh{animation:popin .3s}
.typebox{width:100%;min-height:100px;padding:14px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:20px;resize:none}
.typebox:focus{border-color:var(--sol);outline:none}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.accents button{min-width:40px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.08);font-size:17px}
.gapline{font-size:24px;line-height:1.6;margin:6px 0 6px}
.gapline .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--sol);text-align:center;color:var(--sol);font-weight:600;padding:0 6px}
.hint{color:var(--muted);font-size:15px;margin:0 0 22px}
.intro{display:grid;gap:10px}
.icard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--tile);color:var(--ink);text-align:left;width:100%;box-shadow:0 4px 0 #a48fd0}
.icard b{font-size:20px;display:block}
.icard small{color:#54448a;font-size:14px}
.icard .say{background:var(--ink);box-shadow:none}
.speakcard{background:rgba(255,255,255,.05);border:2px dashed var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.speakcard .es{font-size:26px;font-weight:600;line-height:1.3}
.speakcard .en{color:var(--muted);margin-top:4px}
.heard{font-size:15px;color:var(--muted);min-height:22px;margin:8px 0}
.lfoot{padding:12px 18px 18px;border-top:1px solid var(--line)}
.lfoot .row{gap:10px}
.check{width:100%;padding:16px;border-radius:16px;background:var(--sol);color:var(--ink);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 5px 0 var(--sol-deep)}
.check:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sol-deep)}
.check[disabled]{background:rgba(255,255,255,.1);color:var(--muted);box-shadow:none}
.check.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 18px;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,1.2,.4,1);z-index:3}
.sheet.show{transform:none}
.sheet.ok{background:#0c3a2c;box-shadow:0 -2px 0 var(--menta)}
.sheet.no{background:#3a2408;box-shadow:0 -2px 0 var(--coral)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:28px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sheet.ok h3{color:var(--menta)}
.sheet.no h3{color:var(--coral)}
.sheet .sol{font-size:17px;margin:4px 0 2px}
.sheet .note{font-size:14px;color:#ffd77a;margin:4px 0 0}
.sheet .check{margin-top:14px}
.sheet.ok .check{background:var(--menta);box-shadow:0 5px 0 #1a9a6e}
.sheet.no .check{background:var(--coral);color:#fff;box-shadow:0 5px 0 #b56a12}
.floatxp{position:fixed;font-family:var(--display);color:var(--sol);font-size:28px;pointer-events:none;z-index:60;animation:rise 1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.banner{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;font-family:var(--display);font-size:30px;color:var(--fuego);text-shadow:0 3px 0 rgba(0,0,0,.45);pointer-events:none;animation:bannerin 1.2s ease-out forwards;white-space:nowrap}

/* ---------- end screen ---------- */
.end{flex:1;overflow-y:auto;padding:28px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.end h2{font-family:var(--display);font-weight:400;font-size:40px;color:var(--sol);line-height:1.05}
.end .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.end .t{border-radius:16px;padding:12px 6px;border:2px solid var(--line)}
.end .t b{display:block;font-family:var(--display);font-weight:400;font-size:26px}
.end .t span{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.end .t.xp{border-color:var(--sol)} .end .t.xp b{color:var(--sol)}
.end .t.acc{border-color:var(--menta)} .end .t.acc b{color:var(--menta)}
.end .t.cmb{border-color:var(--fuego)} .end .t.cmb b{color:var(--fuego)}
.end .learned{font-size:15px;color:var(--muted)}
.end .learned b{color:var(--text)}
.chestwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.chest{width:150px;height:130px}
.chest.shake{animation:chestshake .5s 2}
.chest .lid{transform-origin:20px 52px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.chest.open .lid{transform:rotate(-38deg) translate(-6px,-14px)}
.reward{font-family:var(--display);font-size:26px;color:var(--sol);min-height:36px;display:flex;align-items:center;gap:8px}
.reward .svg{width:30px;height:30px}
.tapme{font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* ---------- escena / charla ---------- */
.scene{flex:1;overflow-y:auto;padding:8px 16px 16px}
.scene .titlebar{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.scene .titlebar h2{font-family:var(--display);font-weight:400;font-size:26px;flex:1}
.lines{display:flex;flex-direction:column;gap:10px}
.line{max-width:86%;display:flex;flex-direction:column;gap:2px}
.line.r{align-self:flex-end;align-items:flex-end}
.line .who{font-size:12px;color:var(--muted);font-weight:600;padding:0 6px}
.line .b{display:flex;align-items:flex-start;gap:8px;padding:11px 14px;border-radius:18px 18px 18px 6px;background:var(--cobalt);border:1px solid var(--line);text-align:left;font-size:17px;transition:filter .2s,box-shadow .2s}
.line.r .b{border-radius:18px 18px 6px 18px;background:var(--tile);color:var(--ink)}
.line .b .svg{width:18px;height:18px;margin-top:3px;opacity:.7;flex:none}
.line .tr{font-size:14px;color:var(--muted);padding:2px 8px;display:none}
.line.showtr .tr{display:block}
.line.playing .b{box-shadow:0 0 0 3px var(--sol)}
.lines.blur .line:not(.revealed) .b span{filter:blur(6px)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.08);font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--tile);color:var(--ink)}
.pill .svg{width:18px;height:18px}
.chatlog{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.fix{align-self:flex-end;max-width:90%;background:rgba(255,79,176,.08);border:1px solid rgba(255,79,176,.35);border-radius:14px;padding:10px 12px;font-size:14px}
.fix.good{background:rgba(61,255,168,.08);border-color:rgba(61,255,168,.4);color:var(--menta)}
.fix ol{margin:4px 0 0;padding-left:18px}
.fix s{color:var(--coral)} .fix ins{color:var(--menta);text-decoration:none;font-weight:600}
.fix .why{display:block;color:var(--muted);font-size:13px}
.typing{display:inline-flex;gap:4px;padding:14px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{padding:10px 12px 14px;border-top:1px solid var(--line);background:var(--night)}
.composer .row{gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:120px;padding:12px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:16px;resize:none}
.composer .send{width:48px;height:48px;border-radius:14px;background:var(--sol);color:var(--ink);display:grid;place-items:center;flex:none}
.composer .send .svg,.composer .mic .svg{width:22px;height:22px}
.composer .mic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.composer .mic.on{background:var(--coral);color:#fff}
.sugg{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;color:var(--muted)}
.sugg button{color:var(--sol);text-decoration:underline;text-align:left}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,9,26,.7);display:grid;place-items:center;padding:18px;animation:fade .15s}
.mcard{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:var(--cobalt);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center;animation:popin .25s}
.mcard h2{font-family:var(--display);font-weight:400;font-size:30px;margin-bottom:6px}
.mcard .tipbody{text-align:left;font-size:15.5px}
.mcard .tipbody p{margin:0 0 10px}
.mcard .tipbody b{color:var(--sol)}
.mcard .acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mcard .bigicon{width:90px;height:90px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--sol);color:var(--ink);box-shadow:0 6px 0 var(--sol-deep)}
.mcard .bigicon .svg{width:46px;height:46px}
.lvlnum{font-family:var(--display);font-size:92px;line-height:1;color:var(--sol);text-shadow:0 6px 0 rgba(0,0,0,.35)}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);z-index:70;background:var(--tile);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.2,1.3,.4,1);display:flex;align-items:center;gap:8px;max-width:92vw}
#toast.show{transform:translate(-50%,0)}
#toast .svg{width:20px;height:20px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ---------- rayo ---------- */
.rayohead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.rayohead .score{font-family:var(--display);font-size:30px;color:var(--sol);min-width:60px;text-align:right}
.timer{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.timer i{display:block;height:100%;background:var(--sol);border-radius:99px;transition:width .2s linear}
.timer.low i{background:var(--coral)}

@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes popin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-80px);opacity:0}}
@keyframes bannerin{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
@keyframes chestshake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
@keyframes fade{from{opacity:0}}
@keyframes dots{50%{transform:translateY(-4px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:360px){.plaque h2{font-size:22px}.prompt{font-size:22px}.chip{padding:5px 8px;font-size:14px}}

/* ---------- neon theme details ---------- */
.h1,.plaque h2,.end h2,.mcard h2,.levelgate,.big,.lvlnum,.sheet h3{letter-spacing:.01em}
.h1,.end h2,.levelgate,.big,.lvlnum{text-shadow:0 0 14px rgba(255,79,176,.75),0 0 2px #fff}
.plaque{background:linear-gradient(135deg,#22124a,#150b30);color:var(--text);box-shadow:inset 0 0 0 2px var(--pink),0 0 18px rgba(255,79,176,.35)}
.plaque .meta{color:var(--blue)} .plaque p{color:var(--muted)} .plaque h2{text-shadow:0 0 10px rgba(255,79,176,.8)}
.tipbtn{color:var(--blue);border-color:var(--blue);box-shadow:0 0 10px rgba(45,226,255,.3)}
.unit.tema .plaque{box-shadow:inset 0 0 0 2px var(--blue),0 0 18px rgba(45,226,255,.35)} .unit.tema .plaque h2{text-shadow:0 0 10px rgba(45,226,255,.8)} .unit.tema .plaque .meta{color:var(--pink)}
.go,.check:not([disabled]):not(.ghost),.btn:not(.ghost):not([disabled]){box-shadow:0 5px 0 var(--sol-deep),0 0 22px rgba(255,79,176,.55)}
.node.done{box-shadow:0 6px 0 var(--sol-deep),0 0 16px rgba(255,79,176,.5)}
.node.cur{box-shadow:0 6px 0 #a48fd0,0 0 0 6px rgba(45,226,255,.3),0 0 24px rgba(45,226,255,.6)}
.node.cur::after{border-color:var(--blue)}
.say{color:var(--blue);box-shadow:0 4px 0 #1c1040,0 0 12px rgba(45,226,255,.3)}
.icard .say{color:var(--blue)}
.btn-chest,.instr .new,.sheet.no .check,.chip.boost{color:var(--ink)}
.sheet.ok .check{color:var(--ink)}
.opt[aria-pressed="true"],.pair[aria-pressed="true"]{border-color:var(--blue);background:rgba(45,226,255,.12);box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 14px rgba(45,226,255,.35)}
.typebox:focus{border-color:var(--blue)}
.gapline .blank{border-color:var(--blue);color:var(--blue)}
.prog.hot i{background:linear-gradient(90deg,var(--pink),var(--blue))}
.combo,.banner{color:var(--blue);text-shadow:0 0 12px rgba(45,226,255,.8)}
.floatxp{text-shadow:0 0 12px rgba(255,79,176,.9)}
.week i{background:var(--cobalt-2)} .week i.hit{box-shadow:0 0 10px rgba(255,79,176,.6)}
.wilma{flex:none;filter:drop-shadow(0 0 7px rgba(255,79,176,.75))}
.wcard{display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%;text-align:left}
.wsay .name .svg{width:14px;height:14px;color:var(--blue)}
.wsay{position:relative;flex:1;background:var(--cobalt);border:1px solid var(--blue);border-radius:16px 16px 16px 4px;padding:10px 14px;box-shadow:0 0 14px rgba(45,226,255,.25)}
.wsay{display:block}
.wsay b{display:block;font-size:16px;font-weight:600}
.wsay small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.wsay .name{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700}
.wsheet{position:absolute;right:14px;top:-34px}
.end .wilma{margin-bottom:-6px}
.meter{height:14px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;margin:6px 0 4px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--blue);opacity:.45}
.meter i.s{background:var(--pink);opacity:1;box-shadow:0 0 10px rgba(255,79,176,.7)}
.cando{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:14.5px}
.cando div{display:flex;gap:8px;align-items:flex-start}
.cando .svg{color:var(--menta);margin-top:3px}
.cando .next{color:var(--muted)} .cando .next .svg{color:var(--muted)}
.delta{font-size:12.5px;font-weight:700;color:var(--menta)}
.delta.flat{color:var(--muted)}
.stat b{text-shadow:0 0 10px rgba(45,226,255,.5)}
.nodes .node{flex:none}

/* ---------- listening cards and the town ---------- */
.icard.on{box-shadow:0 4px 0 #a48fd0,0 0 0 3px var(--blue),0 0 18px rgba(45,226,255,.6)}
.instr .new.old{background:var(--cobalt-2);color:var(--blue)}
.speakcard .row{align-items:center}
.rscreen{padding:0 12px}
.rscreen canvas{display:block;width:100%;max-width:500px;aspect-ratio:10/9;margin:0 auto;border-radius:12px;box-shadow:0 0 0 2px var(--pink),0 0 22px rgba(255,79,176,.4);background:var(--night);touch-action:none}
.rpanel{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;max-width:532px;width:100%;margin:0 auto}
.rgoal{display:flex;gap:8px;align-items:center;font-size:14px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.rgoal .svg{color:var(--pink);width:18px;height:18px}
.rpad{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1}
.dpad{position:relative;width:144px;height:144px;flex:none}
.dpad button{position:absolute;width:48px;height:48px;border-radius:12px;background:var(--cobalt-2);color:var(--blue);display:grid;place-items:center;box-shadow:0 4px 0 #1c1040;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad .d-up{left:48px;top:0}.dpad .d-down{left:48px;top:96px}.dpad .d-left{left:0;top:48px}.dpad .d-right{left:96px;top:48px}
.dpad .svg{width:24px;height:24px;pointer-events:none}
.d-up .svg{transform:rotate(-90deg)}.d-down .svg{transform:rotate(90deg)}.d-left .svg{transform:rotate(180deg)}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #1c1040}
.abtn{width:76px;height:76px;border-radius:50%;background:var(--pink);color:var(--ink);font-family:var(--display);font-size:30px;box-shadow:0 5px 0 var(--sol-deep),0 0 20px rgba(255,79,176,.55);flex:none}
.abtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sol-deep)}
.rhint{flex:1;text-align:center;font-size:12.5px;color:var(--muted);margin:0}
.rdlg{display:flex;flex-direction:column;gap:10px}
.rwho{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blue);display:flex;gap:8px}
.rwho.you{color:var(--pink)}
.rline{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font-size:20px;font-weight:600;line-height:1.3;padding:12px 14px;border-radius:16px;background:var(--cobalt);border:1px solid var(--blue);box-shadow:0 0 14px rgba(45,226,255,.25)}
.rline .svg{width:22px;height:22px;color:var(--blue);margin-top:3px}
.rline.ok{border-color:var(--menta);box-shadow:0 0 14px rgba(61,255,168,.3)}
.rtr{color:var(--muted);font-size:15px;padding:0 6px}
.rint{font-size:16px;color:var(--muted)} .rint b{color:var(--text);font-weight:600}
.rhint2{font-size:13.5px;color:var(--muted);margin:8px 0}
.rhint2 .svg{color:var(--pink)}
.rdlg .opt{font-size:17px;padding:12px 14px}
.rdlg .opts{gap:8px}
.answer.sm{min-height:54px;background:none;margin-bottom:12px}
#nav button{font-size:10.5px}
.li.town{margin-bottom:18px;border:1px solid var(--blue);box-shadow:0 0 14px rgba(45,226,255,.25)}
.li.town .num{background:var(--blue)}
.check.live,.check.ghost.live{border-color:var(--pink);color:var(--pink);box-shadow:0 0 16px rgba(255,79,176,.5)}
.sync .svg{width:15px;height:15px}
label.btn{cursor:pointer}

/* ---------- wardrobe and notebook ---------- */
.wardrobe{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ward{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:16px;background:rgba(255,255,255,.05);border:2px solid transparent;text-align:center}
.ward.on{border-color:var(--pink);box-shadow:0 0 14px rgba(255,79,176,.4)}
.ward b{font-size:14px}.ward small{color:var(--muted);font-size:12px}
.ward .tag .svg{width:12px;height:12px;color:var(--pink)}
.wprev{display:grid;place-items:center;width:64px;height:56px;border-radius:12px;background:var(--cobalt-2)}
.nsearch{min-height:0;height:48px;padding:10px 14px;font-size:17px}
.nitem{gap:10px}
.nitem>.svg{width:20px;height:20px;color:var(--blue);flex:none}
.nitem b{font-size:15.5px}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:14px;border-radius:3px;background:rgba(255,255,255,.12)}
.dots i.g{background:var(--blue)}
.dots i.s{background:var(--pink);box-shadow:0 0 6px rgba(255,79,176,.6)}
button.card.li.town{border:1px solid var(--blue)}

#top{padding-top:max(10px,env(safe-area-inset-top))}#nav{padding-bottom:max(10px,env(safe-area-inset-bottom))}.screen .lhead{padding-top:max(14px,env(safe-area-inset-top))}
</style>

<script>

6: [["Los fines de semana me levanto tarde.", "At weekends I get up late."], ["Después de comer, me echo la siesta.", "After lunch, I have a nap."], ["Voy al trabajo en bici.", "I go to work by bike."], ["Normalmente ceno a las nueve.", "I usually have dinner at nine."], ["Me acuesto a medianoche.", "I go to bed at midnight."], ["Por la mañana tomo un café.", "In the morning I have a coffee."]],
7: [["¿Está lejos de aquí?", "Is it far from here?"], ["Coge la primera calle a la derecha.", "Take the first street on the right."], ["¿Dónde está la parada de autobús?", "Where is the bus stop?"], ["Está enfrente del ayuntamiento.", "It's opposite the town hall."], ["Me he perdido.", "I'm lost."], ["Está a diez minutos andando.", "It's a ten-minute walk."]],
8: [["Me gusta más el té que el café.", "I like tea more than coffee."], ["No me gusta nada el frío.", "I don't like the cold at all."], ["¿Qué haces en tu tiempo libre?", "What do you do in your free time?"], ["Me encanta arreglar cosas.", "I love fixing things."], ["Me interesa mucho la electrónica.", "I'm really interested in electronics."], ["Odio madrugar.", "I hate getting up early."]],
9: [["¿Me lo puedo probar?", "Can I try it on?"], ["Me queda pequeño.", "It's too small for me."], ["¿Lo tiene en otro color?", "Do you have it in another colour?"], ["¿Puedo devolverlo?", "Can I return it?"], ["Está de rebajas.", "It's on sale."], ["Me queda genial.", "It looks great on me."]],
10: [["¿Te viene bien el jueves?", "Does Thursday suit you?"], ["Lo siento, ya tengo planes.", "Sorry, I already have plans."], ["¿Qué te parece a las ocho?", "How about eight o'clock?"], ["Llego un poco tarde.", "I'm going to be a bit late."], ["Te espero en la puerta.", "I'll wait for you at the door."], ["Avísame cuando llegues.", "Let me know when you arrive."]],
11: [["Esta mañana he ido al mercado.", "This morning I went to the market."], ["¿Alguna vez has comido pulpo?", "Have you ever eaten octopus?"], ["Todavía no he visto la película.", "I haven't seen the film yet."], ["Hoy he hablado mucho español.", "Today I've spoken a lot of Spanish."], ["Ya he terminado.", "I've already finished."], ["Esta semana he dormido poco.", "This week I've slept little."]],
12: [["Ayer me acosté muy tarde.", "Yesterday I went to bed very late."], ["El verano pasado fuimos a Galicia.", "Last summer we went to Galicia."], ["¿Qué tal el fin de semana?", "How was the weekend?"], ["Fue un día muy largo.", "It was a very long day."], ["Anoche vi una película.", "Last night I watched a film."], ["Llegamos a casa a las tres.", "We got home at three."]],
13: [["De pequeños, jugábamos en la calle.", "As kids, we used to play in the street."], ["Mi abuela siempre hacía croquetas.", "My grandmother always made croquettes."], ["Antes vivíamos en un piso pequeño.", "We used to live in a small flat."], ["No teníamos ordenador.", "We didn't have a computer."], ["Los veranos eran muy largos.", "The summers were very long."], ["Me encantaba desmontar radios.", "I loved taking radios apart."]],
14: [["¿Dónde está la consigna?", "Where is the left-luggage office?"], ["He reservado una habitación doble.", "I've booked a double room."], ["¿A qué hora hay que dejar la habitación?", "What time do we have to leave the room?"], ["El tren va con retraso.", "The train is running late."], ["¿Este autobús va al centro?", "Does this bus go to the centre?"], ["Quiero cambiar mi billete.", "I want to change my ticket."]],
15: [["Tengo cita a las once.", "I have an appointment at eleven."], ["Me he cortado el dedo.", "I've cut my finger."], ["Tengo alergia a la penicilina.", "I'm allergic to penicillin."], ["¿Es grave?", "Is it serious?"], ["Me mareo un poco.", "I feel a bit dizzy."], ["Necesito un justificante.", "I need a doctor's note."]],
16: [["¿Se admiten mascotas?", "Are pets allowed?"], ["El piso está bien comunicado.", "The flat has good transport links."], ["¿Cuánto es la fianza?", "How much is the deposit?"], ["¿Hay ascensor?", "Is there a lift?"], ["Quiero un contrato de un año.", "I want a one-year contract."], ["La calefacción no funciona.", "The heating doesn't work."]],
17: [["Trabajo a media jornada.", "I work part-time."], ["Hoy teletrabajo.", "Today I'm working from home."], ["Tengo mucho trabajo esta semana.", "I have a lot of work this week."], ["Mi contrato termina en marzo.", "My contract ends in March."], ["Me gustaría trabajar en España.", "I'd like to work in Spain."], ["¿Cuál es el horario?", "What are the hours?"]],
18: [["Me gustaría aprender a bailar.", "I'd like to learn to dance."], ["¿Podrías ayudarme?", "Could you help me?"], ["Sería mejor quedar mañana.", "It would be better to meet tomorrow."], ["Yo en tu lugar, iría.", "If I were you, I'd go."], ["Me encantaría vivir cerca del mar.", "I'd love to live near the sea."], ["¿Te importaría cerrar la ventana?", "Would you mind closing the window?"]],
19: [["¿El regalo? Se lo doy mañana.", "The present? I'll give it to her tomorrow."], ["¿Me lo repites, por favor?", "Can you repeat it for me, please?"], ["No la conozco.", "I don't know her."], ["Te lo explico luego.", "I'll explain it to you later."], ["¿Las entradas? Ya las tengo.", "The tickets? I already have them."], ["Les escribo un mensaje.", "I'll write them a message."]],

function distractors(k, field, n) {

  const units = [it.u, it.u - 1, it.u + 1, it.u - 2, it.u + 2, it.u - 3].filter(u => UNIT_KEYS[u]);
  for (const u of units) for (const kk of shuffle(UNIT_KEYS[u][it.t])) {
    if (kk === k) continue; const o = ITEMS[kk];
    if (norm(o.en) === norm(it.en) || plain(o.es) === plain(it.es)) continue;
    const v = o[field];
    if (!out.some(p => norm(p) === norm(v))) out.push(v);
    if (out.length >= n) return out;
  }
  return out;
}
function exPick(k, dir) { const it = ITEMS[k], toEn = dir === 'es2en'; return {type: 'pick', keys: [k], prompt: toEn ? it.es : it.en, promptEs: toEn, ans: toEn ? it.en : it.es, opts: [toEn ? it.en : it.es, ...distractors(k, toEn ? 'en' : 'es', 3)]}; }

const tokens = s => s.replace(/[¿?¡!.,;:…"“”]/g, ' ').split(/\s+/).filter(Boolean);

  const it = ITEMS[k], toEs = dir === 'toEs', target = toEs ? it.es : it.en, tk = tokens(target);

  for (const kk of shuffle(UNIT_KEYS[it.u].s)) {
    if (kk === k) continue;
    for (const t of shuffle(tokens(toEs ? ITEMS[kk].es : ITEMS[kk].en))) { const l = t.toLowerCase(); if (!have.has(l) && !extra.some(e => e.toLowerCase() === l)) { extra.push(t); break; } }
    if (extra.length >= want) break;
  }
  return {type: 'build', keys: [k], prompt: toEs ? it.en : it.es, promptEs: !toEs, target, tiles: [...tk, ...extra]};
}
const exType = k => ({type: 'type', keys: [k], prompt: ITEMS[k].en, target: ITEMS[k].es});
const exDict = k => Voice.ok ? {type: 'dict', keys: [k], audio: ITEMS[k].es, target: ITEMS[k].es} : exType(k);
const exGap = k => { const it = ITEMS[k]; return {type: 'gap', keys: [k], sent: it.sent, ans: it.ans, en: it.en, opts: [it.ans, ...it.d]}; };
const exSpeak = (es, en, k) => ({type: 'speak', keys: [], es, en, k});
const exQ = q => ({type: 'q', keys: [], prompt: q[0], hint: q[1], ans: q[2], opts: [q[2], ...q[3].split('|')]});

// listening-first and speaking-first exercise types
function exLMean(k) { if (!Voice.ok) return exPick(k, 'es2en'); const it = ITEMS[k]; return {type: 'lmean', keys: [k], audio: it.es, ans: it.en, opts: [it.en, ...distractors(k, 'en', 3)]}; }

const exRecall = k => ({type: 'recall', keys: [k], prompt: ITEMS[k].en, target: ITEMS[k].es});

// the ladder: the stronger an item is, the harder the retrieval we ask for
function ladder(k) {
  const it = ITEMS[k], b = boxOf(k), r = Math.random();
  if (it.t === 'g') return exGap(k);
  if (it.t === 'w' || tokens(it.es).length < 3) {

    if (b === 2) return r < .5 ? exListen(k) : exPick(k, 'en2es');
    if (b === 3) return r < .5 ? exType(k) : exRecall(k);
    return r < .4 ? exDict(k) : r < .7 ? exRecall(k) : exType(k);
  }
  if (b <= 1) return r < .5 ? exLMean(k) : exPick(k, 'es2en');
  if (b === 2) return exLBuild(k);
  if (b <= 4) return r < .5 ? exBuild(k, 'toEs') : exRecall(k);

}

}

  let ks = dueKeys();
  if (ks.length < 6) ks = [...ks, ...seenKeys().filter(k => !ks.includes(k)).sort((a, b) => ST.items[a][0] - ST.items[b][0] || ST.items[a][1] - ST.items[b][1])].slice(0, 6);

function startRayo() {
  Sfx.ac();
  let pool = seenKeys().filter(k => ITEMS[k].t === 'w');
  if (pool.length < 15) pool = uniq([...pool, ...range(1, ST.open).flatMap(u => UNIT_KEYS[u].w)]);
  pool = shuffle(pool);
  const R = {i: 0, L: [], Rt: [], score: 0, combo: 0, end: Date.now() + 60000, over: false, selL: null, selR: null, timer: 0};
  const nextKey = () => { for (let t = 0; t < pool.length; t++) { const k = pool[R.i++ % pool.length]; if (!R.L.includes(k) && !R.L.some(x => x && norm(ITEMS[x].en) === norm(ITEMS[k].en))) return k; } return pool[R.i++ % pool.length]; };
  for (let i = 0; i < 5; i++) R.L.push(nextKey()); R.Rt = shuffle(R.L);
  const s = openScreen(`<div class="rayohead"><button class="xbtn" id="rx" aria-label="Stop">${icon('x')}</button><div class="timer" id="rt"><i style="width:100%"></i></div><div class="score" id="rs">0</div></div>
    <div class="lbody"><div class="instr" style="justify-content:center">${icon('bolt')} Rayo · une todas las que puedas</div><div class="pairs"><div class="col" id="rl"></div><div class="col" id="rr"></div></div>
    <p class="hint" style="text-align:center;margin-top:18px">5 in a row = +3 seconds</p></div>`);
  const slot = (side, i, fresh) => { const k = side === 'l' ? R.L[i] : R.Rt[i]; return `<button class="pair ${fresh ? 'fresh' : ''}" data-s="${side}" data-i="${i}">${esc(side === 'l' ? ITEMS[k].es : ITEMS[k].en)}</button>`; };
  const draw = () => { $('#rl').innerHTML = R.L.map((_, i) => slot('l', i)).join(''); $('#rr').innerHTML = R.Rt.map((_, i) => slot('r', i)).join(''); };
  draw();
  const col = {l: $('#rl'), r: $('#rr')};
  const onTap = e => {

const CHAT_HINTS = {fiesta: '¡Hola! Me llamo… ¿Y tú?', bar: 'Una caña, por favor.', quedar: '¡Vale! ¿Quedamos el sábado?', finde: 'El sábado fui a la playa.', piso: '¿Cuánto es el alquiler?', farmacia: 'Me duele la cabeza.', entrevista: 'Trabajo en una empresa en Alemania.', ferreteria: 'Necesito tornillos y una broca.', taller: 'Estoy restaurando una lámpara.', ambiente: '¡Hola! Me llamo… ¿Y tú?', libre: 'Muy bien, gracias. ¿Y tú?'};

async function askPartner(c, hist, text) {

  const prompt = `You are ${c.name}, ${c.role}. This is a roleplay set in Spain with a learner of Spain Spanish. The learner's native language is German and they also speak English. Scenario: ${c.en}.

- Stay in character and be warm and natural. Use Spain Spanish (vosotros, vale, guay, móvil…).
- Level ${level}.
- 1 or 2 short sentences. Usually end with a simple question so the learner can answer.

Then check ONLY the learner's latest message:
- List at most 3 of the most useful mistakes (verb forms, gender and agreement, word choice, word order, spelling, missing accents that change meaning). Ignore capital letters and missing ¿ ¡.
- If the learner used English or German words, show how to say that part in Spanish as a correction.
- If the message is correct, return an empty list.
- "why" is a short, kind explanation in English, at most 12 words.

Conversation so far:
${hist.map(m => (m.who === 'bot' ? c.name : 'Learner') + ': ' + m.text).join('\n')}

Learner's latest message: ${text}

Return only a JSON object, no other text:
{"reply":"your reply in Spanish","reply_en":"English translation of your reply","corrections":[{"wrong":"...","right":"...","why":"..."}],"suggestion":"one short example of what the learner could say next, in Spanish"}`;
  const sm = CAP.sample; let v = null;
  if (typeof sm.json === 'function') { try { v = await sm.json(prompt, {cache: false}); } catch (e) { if (e && e.code && e.code !== 'parse_error' && e.code !== 'invalid_json') throw e; } }

}

    $('#nlist').innerHTML = list.length ? list.slice(0, 300).map(it => `<button class="li nitem" data-k="${esc(it.k)}">${icon('speaker')}<span class="grow"><b>${esc(it.es)}</b><small>${esc(it.en)}</small></span>${strength(boxOf(it.k))}</button>`).join('') + (list.length > 300 ? `<p class="hint" style="text-align:center">Showing 300 of ${list.length}. Search to find more.</p>` : '')

  ensureDay(); const due = dueKeys().length, st = shownStreak(), hr = new Date().getHours(), playedToday = ST.last === today();
  if (!ST.st.lessons && !ST.xp) return ['idle', WSAY.hola, 'I’m Wilma. Shall we start? Two minutes is enough.', 'hola'];
  if (ST.goalHit) return ['happy', '¡Objetivo cumplido! Prrr…', 'Daily goal done. Anything more is a bonus.', 'meta'];
  if (st > 0 && !playedToday && hr >= 18) return ['soft', `Tu racha de ${st} días te espera.`, `Your ${st}-day streak is waiting. One short lesson saves it.`, 'racha'];
  if (ST.last && today() - ST.last >= 3) return ['soft', WSAY.vuelta, 'You’re back! I missed you. No guilt, just one small step.', 'vuelta'];
  if (due >= 12) return ['idle', `Tengo ${due} cosas para repasar.`, `${due} things are about to fade. A quick Repaso keeps them.`, 'repaso'];
  if (playedToday) return ['happy', WSAY.mas, `Nice work today. ${Math.max(0, ST.goal - ST.dayXp)} XP to your goal.`, 'mas'];
  return pick([['idle', WSAY.jugar, 'Shall we play a little?', 'jugar'], ['idle', WSAY.dos, 'Two minutes. You can do it.', 'dos'], ['happy', WSAY.nuevo, 'Something new today.', 'nuevo'], ['sleep', 'Zzz… ' + WSAY.zzz, 'Zzz… huh? Oh, hi!', 'zzz']]);
}

/* ================= backups: move progress between versions and phones ================= */
const b64 = {
  enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
};
async function packState() {
  const json = JSON.stringify(ST);
  try { if (typeof CompressionStream === 'function') { const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); return 'CHISPA1:' + b64.enc(new Uint8Array(buf)); } } catch (e) {}
  return 'CHISPA0:' + b64.enc(new TextEncoder().encode(json));
}
async function unpackState(code) {
  code = String(code || '').trim().replace(/\s+/g, '');
  if (code.startsWith('{')) return JSON.parse(code);
  const m = code.match(/^CHISPA([01]):(.+)$/); if (!m) throw new Error('format');
  const bytes = b64.dec(m[2]);
  if (m[1] === '0') return JSON.parse(new TextDecoder().decode(bytes));
  const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
async function exportBackup() {
  const code = await packState(); ST.backup = Date.now(); Store.save();
  let copied = false; try { await navigator.clipboard.writeText(code); copied = true; } catch (e) {}
  const m = modal(`<h2>Copia de seguridad</h2><p class="sub" style="margin:0 0 10px">${copied ? 'The backup code is copied. Paste it somewhere safe, like a note or a message to yourself.' : 'Copy this code and keep it somewhere safe.'}</p>
    <textarea class="typebox" id="bkcode" rows="4" readonly style="font-size:12px">${esc(code)}</textarea>
    <div class="acts">${IS_APP ? '<button class="btn wide" id="bkfile">Save as a file</button>' : ''}<button class="btn ${IS_APP ? 'ghost ' : ''}wide" id="bkcopy">Copy code</button><button class="btn ghost wide" data-close>Done</button></div>`);
  $('#bkcode', m.m).onclick = e => e.target.select();
  $('#bkcopy', m.m).onclick = async () => { try { await navigator.clipboard.writeText(code); toast(icon('check') + ' Copied'); } catch (e) { $('#bkcode', m.m).select(); toast('Select the code and copy it.'); } };
  if (IS_APP) $('#bkfile', m.m).onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], {type: 'text/plain'})); a.download = 'chispa-backup-' + new Date().toISOString().slice(0, 10) + '.txt'; document.body.appendChild(a); a.click(); a.remove(); };
  rerender();
}
function importBackup() {
  const m = modal(`<h2>Restaurar progreso</h2><p class="sub" style="margin:0 0 10px">Paste a backup code, or pick a backup file. This replaces the progress on this ${IS_APP ? 'phone' : 'device'}.</p>
    <textarea class="typebox" id="imcode" rows="4" placeholder="CHISPA1:…" style="font-size:12px"></textarea>
    <label class="btn ghost wide" style="margin-top:10px">Choose a file<input type="file" id="imfile" accept=".txt,text/plain,application/json" hidden></label>
    <p class="heard" id="imerr"></p><div class="acts"><button class="btn wide" id="imgo">Restore</button><button class="btn ghost wide" data-close>Cancel</button></div>`);

}
async function offlineStatus() {

function startNode(u, n) {
  const U = [...COURSE, ...EXTRA].find(x => x.id === u), N = nodesOf(u), fresh = n === 0 && !(ST.prog[u] || 0);
  const run = () => {
    if (n <= 2) startSession('lesson', {u, node: n, q: genLesson(u, n)});
    else if (SCENES[u] && n === 3) openScene(u);
    else startSession('boss', {u, node: N - 1, q: genBoss(u)});
  };
  if (fresh) { const m = modal(`<div class="instr" style="justify-content:center">${icon('book')} Guía rápida</div><h2>${esc(U.tip[0])}</h2><div class="tipbody">${U.tip[1]}</div><div class="acts"><button class="btn wide" id="tipgo">¡Empezar!</button></div>`); $('#tipgo', m.m).onclick = () => { m.m.remove(); run(); }; }
  else run();
}
function genTest(u) {
  const q = []; shuffle(range(Math.max(1, u - 5), u)).forEach((x, i) => { const K = UNIT_KEYS[x]; q.push(i % 2 ? exBuild(pick(K.s), 'toEs') : exGap(pick(K.g))); q.push(i % 3 === 0 ? exType(pick(K.w)) : exPick(pick(K.w), 'en2es')); });
  return q.slice(0, 12);
}
function nextStep() {
  const due = dueKeys().length;
  if (due >= 12) return {label: `Repaso · ${due} para repasar`, run: () => startSession('review', {q: genReview()})};
  const names = n => n <= 2 ? 'Lección ' + (n + 1) : 'Final';
  for (let u = 1; u <= UNITS; u++) if (u <= ST.open && unitDone(u) && COURSE[u - 1].x && !ST.bonus[u]) { const U = COURSE[u - 1]; return {label: `${U.t} · Más frases`, run: () => startSession('bonus', {u, q: genBonus(u)})}; } else if (u <= ST.open && !unitDone(u)) { const n = ST.prog[u] || 0, U = COURSE[u - 1]; return {label: `${U.t} · ${SCENES[u] && n === 3 ? 'Escena' : names(n)}`, run: () => startNode(u, n)}; }
  for (const U of EXTRA) if (!unitDone(U.id)) { const n = ST.prog[U.id] || 0; return {label: `${U.t} · ${names(n)}`, run: () => startNode(U.id, n)}; }
  if (due) return {label: `Repaso · ${due} items`, run: () => startSession('review', {q: genReview()})};
  return {label: 'Rayo · 60 segundos', run: startRayo};
}

function logDay(r, w) {
  const n = today(); ST.snap[n] = [seenKeys().length, strongCount()];
  const a = ST.acc[n] || [0, 0]; ST.acc[n] = [a[0] + r, a[1] + r + w];
  for (const o of [ST.snap, ST.acc]) { const ks = Object.keys(o).map(Number).sort((x, y) => x - y); while (ks.length > 60) delete o[ks.shift()]; }
}
function weekReport() {

  const xp = days.reduce((s, d) => s + (ST.hist[d] || 0), 0), xpPrev = prev.reduce((s, d) => s + (ST.hist[d] || 0), 0), active = days.filter(d => ST.hist[d]).length;
  const before = Object.keys(ST.snap).map(Number).filter(d => d < n - 6).sort((a, b) => b - a)[0];

    <div class="row"><b style="width:28px">A2</b><div class="grow"><div class="meter"><i style="width:${a2[0]}%"></i><i class="s" style="width:${a2[1]}%"></i></div></div><span class="n" style="width:44px;text-align:right">${a2[0]}%</span></div></div>
  <div class="stats" style="margin-bottom:14px">
    <div class="stat"><b>${W.seen}</b><span>words & phrases met ${delta(W.newItems)}</span></div><div class="stat"><b>${W.strong}</b><span>in long-term memory ${delta(W.newStrong)}</span></div>
    <div class="stat"><b>${shownStreak()}</b><span>day streak · best ${ST.best}</span></div><div class="stat"><b>${W.acc === null ? '–' : W.acc + '%'}</b><span>accuracy this week</span></div>
    <div class="stat"><b>${ST.st.spoken}</b><span>sentences said out loud</span></div><div class="stat"><b>${RPG.doneCount()}/${RPG.total()}</b><span>town conversations</span></div><div class="stat"><b>${dueKeys().length}</b><span>waiting for review today</span></div><div class="stat"><b>${ST.xp}</b><span>total XP</span></div></div>
  <div class="card"><h3>Last 7 days</h3><p style="margin:0">Pink bars reached your goal of ${ST.goal} XP.</p><div class="week">${days.map(d => { const x = ST.hist[d] || 0; return `<div title="${x} XP"><i class="${x >= ST.goal ? 'hit' : ''}" style="height:${Math.round(100 * x / mx)}%;${x >= ST.goal ? 'background:var(--pink)' : x ? 'background:var(--blue);opacity:.6' : ''}"></i><span>${dn[new Date((d + .5) * 86400000).getUTCDay()]}</span></div>`; }).join('')}</div></div>
  <div class="card"><h3>Ya puedes…</h3><p>Things you can now do in Spanish.</p><div class="cando">${can.length ? can.map(U => `<div>${icon('check')}<span>${esc(U.en)}</span></div>`).join('') : ''}${nextU ? `<div class="next">${icon('chev')}<span>Next: ${esc(nextU.en)}</span></div>` : ''}</div></div>
  <div class="card"><h3>Logros</h3><p>${Object.keys(ST.badges).length} of ${BADGES.length}</p><div class="badges">${BADGES.map(b => `<div class="badge ${ST.badges[b[0]] ? '' : 'off'}"><span class="medal">${icon(b[3])}</span><b>${esc(b[1])}</b><small>${esc(b[2])}</small></div>`).join('')}</div></div>
  ${wardrobeCard()}
  <div class="card shop"><h3>Tienda</h3><p>Spend your gems.</p><div class="list">
    <button class="li" id="buyfreeze"><span class="num">${icon('shield')}</span><span class="grow"><b>Protector de racha</b><small>Saves your streak if you miss a day. You have ${ST.freezes} of 3.</small></span><span class="tag">50 ${icon('gem')}</span></button>
    <button class="li" id="buyboost"><span class="num">${icon('bolt')}</span><span class="grow"><b>Doble XP</b><small>15 minutes of double XP.</small></span><span class="tag">80 ${icon('gem')}</span></button></div></div>
  <div class="card"><h3>Ajustes</h3><p>Daily goal</p><div class="seg">${[50, 100, 200, 300].map(g => `<button data-goal="${g}" aria-pressed="${ST.goal === g}">${g} XP</button>`).join('')}</div>
    <button class="toggle" role="switch" data-tog="sfx" aria-checked="${ST.sfx}" style="margin-top:12px"><span>Sound effects</span><span class="sw"></span></button>
    <button class="toggle" role="switch" data-tog="auto" aria-checked="${ST.auto}"><span>Play Spanish audio automatically</span><span class="sw"></span></button>
    <button class="toggle" role="switch" data-tog="wv" aria-checked="${ST.wv}"><span>Wilma talks</span><span class="sw"></span></button>
    <button class="btn ghost wide" id="soundtest" style="margin-top:10px">${icon('speaker')} Probar sonido</button><p class="sync" style="margin-top:8px">No sound? Check the phone’s volume and silent switch, then tap again.</p>
    <div class="sync" id="sync"></div>${IS_APP ? '<div class="sync cloud" id="offline"></div>' : ''}</div>
  <div class="card"><h3>${icon('shield')} Copia de seguridad</h3><p>${IS_APP ? 'Your progress lives on this phone. Make a backup now and then so you never lose it.' : 'Move your progress to the Chispa phone app, or keep a copy.'} Last backup: ${ST.backup ? new Date(ST.backup).toLocaleDateString() : 'never'}.</p>
    <div class="row"><button class="btn grow" id="bkexp">Export</button><button class="btn ghost grow" id="bkimp">Import</button></div></div>`;
};

/* ================= events ================= */
function showTip(u) { const U = [...COURSE, ...EXTRA].find(x => x.id === u); modal(`<div class="instr" style="justify-content:center">${icon('book')} Guía · ${esc(U.t)}</div><h2>${esc(U.tip[0])}</h2><div class="tipbody">${U.tip[1]}</div><div class="acts"><button class="btn wide" data-close>Vale</button></div>`); }
function doneMenu(u) {
  const U = COURSE[u - 1];
  const m = modal(`<h2>${esc(U.t)}</h2><p class="sub" style="margin:0">Practise again. Replays still give XP and strengthen memory.</p><div class="acts">${[0, 1, 2].map(n => `<button class="btn ghost wide" data-n="${n}">Lección ${n + 1}</button>`).join('')}<button class="btn ghost wide" data-n="3">${icon('headphones')} Escena</button><button class="btn ghost wide" data-n="4">${icon('crown')} Final</button>${U.x ? `<button class="btn ${ST.bonus[u] ? 'ghost ' : ''}wide" id="dm-more">${icon('star')} Más frases</button>` : ''}<button class="btn ghost wide" id="dm-tip">${icon('book')} Guía</button><button class="btn wide" data-close>Cerrar</button></div>`);
  $$('[data-n]', m.m).forEach(b => b.onclick = () => { m.m.remove(); startNode(u, +b.dataset.n); });
  $('#dm-tip', m.m).onclick = () => { m.m.remove(); showTip(u); };
  const mb = $('#dm-more', m.m); if (mb) mb.onclick = () => { m.m.remove(); startSession('bonus', {u, q: genBonus(u)}); };
}
function onView(e) {
  const t = e.target.closest('button'); if (!t) return; Sfx.ac(); const d = t.dataset;
  if (d.n !== undefined && d.u) return startNode(+d.u, +d.n);
  if (d.tip) return showTip(+d.tip);
  if (d.done) return doneMenu(+d.done);
  if (d.test) { const u = +d.test; const m = modal(`${wilma('idle', 80)}<h2>¿Saltar a la unidad ${u}?</h2><p class="sub" style="margin:0">A short test on units up to ${u - 1}. Score 75% or more and everything before it unlocks.</p><div class="acts"><button class="btn wide" id="tgo">Hacer la prueba</button><button class="btn ghost wide" data-close>Ahora no</button></div>`); $('#tgo', m.m).onclick = () => { m.m.remove(); startSession('test', {u: u - 1, q: genTest(u - 1)}); }; return; }
  if (d.scene) return openScene(+d.scene);
  if (d.chat) return openChat(CHATS.find(c => c.id === d.chat));
  if (d.ward) return wardTap(d.ward);
  if (d.goal) { ST.goal = +d.goal; Store.save(); return rerender(); }
  if (d.tog) { ST[d.tog] = !ST[d.tog]; Store.save(); t.setAttribute('aria-checked', ST[d.tog]); return; }
  switch (t.id) {
    case 'wtalk': return Voice.speak(WSAY[d.say] || WSAY.hola, {v: 'w'});
    case 'soundtest': return Voice.seq([[WSAY.hola, {v: 'w'}], ['¿Me pones un café con leche?', {}]]);
    case 'gopueblo': return RPG.open();
    case 'donote': return openNotebook();
    case 'bkexp': return exportBackup();
    case 'bkimp': return importBackup();
    case 'doreview': return startSession('review', {q: genReview()});
    case 'dorayo': return startRayo();
    case 'qchest': { ST.quests.chest = 2; Store.save(); const m = modal(`<h2>Cofre de misiones</h2><div class="chestwrap"><button id="chestBtn" aria-label="Open the chest">${chestSVG()}</button><div class="reward" id="rw"></div><div class="tapme" id="tapme">Toca el cofre</div></div><div class="acts"><button class="btn wide" data-close>Cerrar</button></div>`, {onClose: () => { checkBadges().forEach(b => pendingCeleb.push({k: 'badge', b})); rerender(); runCeleb(); }}); wireChest(m.m, true); return; }
    case 'buyfreeze': if (ST.freezes >= 3) return toast('You already have 3 protectors.'); if (ST.gems < 50) return toast('Not enough gems yet.'); ST.gems -= 50; ST.freezes++; Store.save(); Sfx.play('combo', 4); return rerender();
    case 'buyboost': if (ST.gems < 80) return toast('Not enough gems yet.'); ST.gems -= 80; ST.boost = Math.max(ST.boost, Date.now()) + 15 * 60000; Store.save(); Sfx.play('combo', 8); toast(icon('bolt') + ' Doble XP · 15 min'); return rerender();
  }
}
let celebBusy = false;
function runCeleb() {
  if (celebBusy) return; const c = pendingCeleb.shift(); if (!c) { Store.save(); return; }
  if (c.k === 'freeze') { toast(icon('shield') + ` Wilma used ${c.n} protector${c.n > 1 ? 'es' : ''}. Your streak is safe.`); return runCeleb(); }
  celebBusy = true; const nextOne = () => { celebBusy = false; renderTop(); runCeleb(); };
  let html;
  if (c.k === 'level') { html = `${wilma('wow', 100)}<div class="instr" style="justify-content:center;margin-top:8px">¡Subes de nivel!</div><div class="lvlnum">${c.L}</div><h2>${esc(titleFor(c.L))}</h2><p class="sub" style="margin:0">+25 ${icon('gem')}</p>`; ST.gems += 25; Sfx.play('level'); FX.burst(); setTimeout(() => wsay('nivel'), 700); }
  else if (c.k === 'badge') { html = `<div class="bigicon">${icon(c.b[3])}</div><div class="instr" style="justify-content:center">Nuevo logro</div><h2>${esc(c.b[1])}</h2><p class="sub" style="margin:0">${esc(c.b[2])} · +10 ${icon('gem')}</p>`; Sfx.play('combo', 7); FX.burst(innerWidth / 2, innerHeight / 3, 60); }
  else { html = `${wilma('happy', 100)}<h2>¡Objetivo del día!</h2><p class="sub" style="margin:0">${ST.goal} XP today. Prrr. +30 ${icon('gem')}</p>`; Sfx.play('win'); FX.burst(); setTimeout(() => wsay('objetivo'), 700); }
  modal(html + `<div class="acts"><button class="btn wide" data-close>¡Toma ya!</button></div>`, {onClose: nextOne});
}
function welcome() {
  const m = modal(`${wilma('happy', 120)}<h2>¡Miau! Soy Wilma</h2><div class="tipbody"><p>I’ll be your guide. Here’s the deal:</p><p><b>1.</b> Lessons take 2–3 minutes. Hit <b>Seguir</b> and I pick the next step for you.</p><p><b>2.</b> No hearts, no punishment. What you miss simply comes back later, right when your memory needs it.</p><p><b>3.</b> You hear everything. Say it out loud with me, nobody is listening.</p><p><b>4.</b> <b>Pueblo</b> is a little town to walk around and talk in. <b>Temas</b> has Spanish for your own interests.</p><p>Already know some Spanish? Tap <b>Saltar</b> on a locked unit to jump ahead.</p></div><div class="acts"><button class="btn wide" data-close>¡Vamos!</button></div>`, {onClose: () => { ST.welcomed = 1; Store.save(); wsay('hola'); }});
}
function boot() {
  Store.loadLocal(); if (IS_APP) { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} } ensureDay(); ensureQuests(); Voice.init(); Mic.init();
  cuse('sample').then(s => { CAP.sample = s; if (s && TAB === 'entrenar' && !$('#scr')) rerender(); });
  $('#view').addEventListener('click', onView);
  $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { Sfx.ac(); if (b.dataset.tab === 'pueblo') RPG.open(); else go(b.dataset.tab); } });
  go('camino'); Store.connect().then(() => { if (!ST.welcomed && !$('.modal')) welcome(); });
  setTimeout(() => { if (!ST.welcomed && !$('.modal') && !$('#scr')) welcome(); }, 1200);
}
boot();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'activated' && navigator.serviceWorker.controller) toast('Chispa se ha actualizado. Ciérrala y ábrela para ver lo nuevo.'); }); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { try { renderSync(); } catch (e) {} });
});
</script>
</body>
</html>
